[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "serverpilot"
dynamic = ["version"]
description = "ServerPilot: agent-coordinated server compute scheduling with human supervision."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jinpeng Lu" }]
keywords = ["server-scheduling", "compute-coordination", "gpu", "mcp", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  # The control plane runs on macOS or Windows; the collector and keepalive
  # entry points run on the Linux GPU servers it coordinates.
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.27,<2",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/JinPLu/ServerPilot"
Repository = "https://github.com/JinPLu/ServerPilot"
Documentation = "https://github.com/JinPLu/ServerPilot/tree/master/docs"
Changelog = "https://github.com/JinPLu/ServerPilot/blob/master/CHANGELOG.en.md"
Issues = "https://github.com/JinPLu/ServerPilot/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]
windows = [
  "pillow>=10,<12",
  "pyinstaller>=6.14,<7",
  "pythonnet>=3.0,<4",
  "pywebview>=5.4,<7",
]

[project.scripts]
serverpilot = "serverpilot.cli:app"
serverpilot-mcp = "serverpilot.mcp_server:main"
serverpilot-collect = "serverpilot.server_collector:main"
serverpilot-keepalive = "serverpilot.server_keepalive:main"

[tool.setuptools.dynamic]
version = {attr = "serverpilot.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
serverpilot = [
  "migrations/*.py",
  "migrations/*.mako",
  "migrations/versions/*.py",
  "bundled_plugins/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4", "RET"]
# E501 is left to a separate `ruff format` adoption; enforcing it now would
# rewrap the codebase and bury every other change in the same diff.
ignore = ["E501"]
