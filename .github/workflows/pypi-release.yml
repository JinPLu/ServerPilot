name: PyPI release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing exchanges this for a short-lived PyPI credential,
      # so the repository never stores a long-lived API token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv lock --check
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Refuse to publish a version the tag does not name
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("src/serverpilot/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE)
          if match is None:
              raise SystemExit("cannot read __version__ from src/serverpilot/__init__.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match __version__ {version}")
          expected = {f"serverpilot-{version}.tar.gz", f"serverpilot-{version}-py3-none-any.whl"}
          built = {path.name for path in Path("dist").iterdir()}
          if built != expected:
              raise SystemExit(f"dist holds {sorted(built)}, expected {sorted(expected)}")
          PY
      - name: Verify the wheel carries what the installed package needs
        run: python scripts/verify_wheel.py dist
      - uses: pypa/gh-action-pypi-publish@release/v1
