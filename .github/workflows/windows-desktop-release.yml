name: Windows desktop release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive the Windows asset
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Verify Windows launcher contract
        run: uv run --extra dev --extra windows pytest tests/test_windows_launcher.py -q
      - name: Build Windows desktop app
        shell: pwsh
        run: ./desktop/build-windows-app.ps1
      - name: Verify packaged runtime assets
        shell: pwsh
        run: |
          $root = "dist\windows\ServerPilot"
          $envPy = Get-ChildItem -Path $root -Recurse -File -Filter "env.py" |
            Where-Object { $_.DirectoryName -like "*serverpilot\migrations" }
          if (-not $envPy) { throw "packaged app is missing serverpilot/migrations/env.py" }
          $versions = Get-ChildItem -Path $root -Recurse -File -Filter "*.py" |
            Where-Object { $_.DirectoryName -like "*serverpilot\migrations\versions" }
          if ($versions.Count -lt 1) { throw "packaged app is missing serverpilot/migrations/versions/*.py" }
          if (-not (Test-Path (Join-Path $root "serverpilot-mcp.exe"))) {
            throw "packaged app is missing serverpilot-mcp.exe; agents would have no MCP entry point"
          }
          "packaged migrations: env.py plus $($versions.Count) version scripts"

      - name: Package Windows desktop app
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ServerPilot-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path "dist\windows\ServerPilot\*" -DestinationPath $archive -Force
          "WINDOWS_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:RELEASE_TAG $env:WINDOWS_ARCHIVE --clobber
